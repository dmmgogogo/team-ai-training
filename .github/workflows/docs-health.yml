name: docs-health

# 每周体检：只生成报告并提示问题，不自动修改文档、不自动提交。
on:
  schedule:
    - cron: "0 3 * * 1" # 每周一 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Health check (internal links + external links)
        run: python scripts/check_docs.py --links || true

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-check-report
          path: reports/docs-check-report.md
          if-no-files-found: warn

      - name: Fail on broken internal links or stale metadata
        run: |
          python scripts/check_docs.py
          python scripts/check_docs.py --links --strict
